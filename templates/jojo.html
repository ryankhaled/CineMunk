<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_jojo.css') }}">
</head>

<header>
    <div class="logo">
        <a href="{{ url_for('home') }}">  <!-- permet que si on clique sur le logo CM, sa nous ramème à la page d'acceuille du sitweb -->
            <img src="{{ url_for('static', filename='CM_logo.png') }}" alt="Company Logo">  <!-- permet de mettre le logo, et si le logo n'a pas chargé il y a le mot ''Comapny Logo'' qui va être à la place de l'image -->
        </a>
    </div>
</header>
<br>
<br>
<br>
<br>

<body> 
    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Saison</th>
            </tr>
        </thead>
        <tbody>
            {%for nomserie, nomsaison in Jojo %} <!-- Boucle pour afficher le nom de chaque saison de la série Jojo's bizzare adventure-->
                <tr>
                    <td>{{nomserie}}</td>
                    <td>{{nomsaison}}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
