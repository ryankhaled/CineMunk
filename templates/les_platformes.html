<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemunck</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_general.css') }}">
</head>


<body>
    <header>
        <div class="logo">
            <a href="{{ url_for('home') }}"> <!-- permet que si on clique sur le logo CM, sa nous ramème à la page d'acceuille du sitweb -->
                <img src="{{ url_for('static', filename='CM_logo.png') }}" alt="Company Logo"><!-- permet de mettre le logo, et si le logo n'a pas chargé il y a le mot ''Comapny Logo'' qui va être à la place de l'image -->
            </a>
        </div>
    </header>

    <h1 id="titre"><center>Platformes</center></h1>

<!-- Ligne horizontale pour séparer les éléments -->
    <hr class="half-line">

    <!--  ajoute un Search Bar -->
    <div class="search-bar-container">
        <input type="text" class="search-bar" placeholder="Search...">
    </div>

<!-- Ligne horizontale pour séparer les éléments -->
    <hr class="half-line">



<br>
<br>
<br>
<br>


<body>
    <div class="tables"><!-- Conteneur pour les tables, avec style défini dans le CSS -->
        {% for idplatforme in platforme %}<!-- Boucle pour afficher chaque platforme -->
            <div class="attributs">
                <div class="image-container">
                    <img src="{{idplatforme[3]}}"><!-- prend le url de la colonne urlplatforme et l'affiche sous forme d'image   -->
                </div>
                <!-- il y a une tuple, on a choisi donc les éléments sous forme de idplatforme[n] à partir du tableau donner par la requête SQL écrite et trouvé dans le fichier cinemunckdb.py-->
                <p><b>Platforme:</b> {{idplatforme[1]}}</p><!-- affiche le titre de la platforme qui est l'élément de la colonne nomplatforme   -->
                <p><b>Prix:</b> {{idplatforme[2]}}</p> <!-- affiche si la platforme est payante ou gratuite, selon l'élément de la colonne prix  -->         
            </div>
        
        {% endfor %}
    </div>
</body>
</html>
