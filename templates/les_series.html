<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemunck</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_general.css') }}">
</head>


<body>
    <header>
        <div class="logo">
            <a href="{{ url_for('home') }}"> <!-- permet que si on clique sur le logo CM, sa nous ramème à la page d'acceuille du sitweb -->
                <img src="{{ url_for('static', filename='CM_logo.png') }}" alt="Company Logo"><!-- permet de mettre le logo, et si le logo n'a pas chargé il y a le mot ''Comapny Logo'' qui va être à la place de l'image -->
            </a>
        </div>
    </header>

    <h1 id="titre"><center>Series</center></h1>

    <!-- Ligne horizontale pour séparer les éléments -->
    <hr class="half-line">

    <!--  ajoute un Search Bar -->
    <div class="search-bar-container">
        <input type="text" class="search-bar" placeholder="Search...">
    </div>

    <!-- Ligne horizontale pour séparer les éléments -->
    <hr class="half-line">



<br>
<br>
<br>
<br>


<body>
    <div class="tables"><!-- Conteneur pour les tables, avec style défini dans le CSS -->
        {% for idserie in serie %}<!-- Boucle pour afficher chaque série -->
            <div class="attributs">
                <div class="image-container">
                    <img src="{{idserie[7]}}"><!-- prend le url de la colonne urlserie et l'affiche sous forme d'image   -->
                </div>
                <p><b>Série:</b> {{idserie[1]}}</p><!-- affiche le titre de la série qui est l'élément de la colonne nomserie  -->
                <p><b>Genre:</b><br> {{idserie[5]}}</p>  <!-- affiche le genre de la série qui est l'élément de la colonne nomgenre   -->
                <p><b>Nombre de saison:</b> {{idserie[4]}}</p> <!-- affiche le nombre totale de saison dans la série qui est l'élément de la colonne nbsaison   -->
                <p><b>Nombre d'épisode:</b> {{idserie[3]}}</p><!-- affiche le nombre totale d'épisode dans la série qui est l'élément de la colonne episodetotale   -->
                <p><b>date de sortie:</b> {{idserie[2]}}</p> <!-- affiche la date de sortie de la série qui est l'élément de la colonne datesortie   -->
                <p><b>Disponible sur la platforme:</b> {{idserie[6]}}</p> <!-- affiche le nom de la platforme où on peut visioné la série qui est l'élément de la colonne nomplatforme  -->

            </div>
        
        {% endfor %}
    </div>
</body>
</html>
